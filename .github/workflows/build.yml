name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2

    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build