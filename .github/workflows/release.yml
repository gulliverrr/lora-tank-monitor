name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^set(PROJECT_VER .*)$/set(PROJECT_VER \"${version}\")/" CMakeLists.txt
          grep -q "PROJECT_VER \"${version}\"" CMakeLists.txt
          idf.py set-target esp32
          idf.py build
          idf.py merge-bin -o lora_tank_monitor-full.bin

      - name: Package assets
        shell: bash
        run: |
          mkdir dist
          cp build/lora_tank_monitor.bin dist/
          cp build/lora_tank_monitor-full.bin dist/
          cd dist
          sha256sum lora_tank_monitor.bin lora_tank_monitor-full.bin > SHA256SUMS
          size=$(stat -c %s lora_tank_monitor.bin)
          sha=$(sha256sum lora_tank_monitor.bin | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/lora_tank_monitor.bin"
          printf '{"version":"%s","url":"%s","sha256":"%s","size":%s}\n' \
            "${GITHUB_REF_NAME#v}" "$url" "$sha" "$size" > manifest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/lora_tank_monitor.bin
            dist/lora_tank_monitor-full.bin
            dist/SHA256SUMS
            dist/manifest.json
          body: |
            - `lora_tank_monitor.bin`: upload this from the device's provisioning page (Firmware section).
            - `lora_tank_monitor-full.bin`: complete image for a first USB flash at offset `0x0`.
